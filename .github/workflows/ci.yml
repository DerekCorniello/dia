name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go modules
        run: go mod verify

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt found issues:"
            echo "$fmt"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Test
        run: python tools/ci/report_go_tests.py --log test-results/unit.jsonl --label "Go tests (${{ runner.os }})" -- go test -json -count=1 -p 1 -timeout 3m ./...

      - name: Race test (Linux)
        if: runner.os == 'Linux'
        run: python tools/ci/report_go_tests.py --log test-results/race.jsonl --label "Race tests" -- go test -json -race -count=1 -p 1 -timeout 3m ./internal/...

      - name: Upload Go test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend-checks:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test CI reporter
        run: python -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Svelte check
        run: npm run check
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint -- --max-warnings=0
        working-directory: frontend

      - name: Frontend format
        run: npm run format:check
        working-directory: frontend

      - name: Frontend tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
        working-directory: frontend

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tests
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-frontend:
    name: build desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        # Version comes from go.mod so the CLI and the compiled-in
        # runtime cannot drift; a mismatch only warns at build time.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build with Wails
        run: wails build -clean -tags webkit2_41
